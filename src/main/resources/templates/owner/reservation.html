<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <div th:replace="~{fragment :: meta}"></div>

        <div th:replace="~{fragment :: styles}"></div>

        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">

        <!-- Swiper -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css">

        <title>予約状況の確認</title>
    </head>
    <body>
       <div class="samuraitravel-wrapper">
           <div th:replace="~{fragment :: header}"></div>
           
           <main>
   			  <div class="container pt-4 pb-5 samuraitravel-container">
     			  <div class="row justify-content-center">
	        		  <div class="col-xxl-9 col-xl-10 col-lg-11">
			             <h1 class="mb-4 text-center">予約状況</h1>
			   
                           <table class="table">
                               <thead>
                                   <tr>
                                       <th scope="col">お客様名</th>
                                       <th scope="col">チェックイン日</th>
                                       <th scope="col">チェックアウト日</th>
                                       <th scope="col">宿泊人数</th>
                                       <th scope="col">宿泊料金</th>
                                   </tr>
                               </thead>
                               <tbody>
                                   <tr th:each="reservation : ${reservationPage}">
                                       <td th:text="${reservation.user.name}"></td>
                                       <td th:text="${reservation.checkinDate}"></td>
                                       <td th:text="${reservation.checkoutDate}"></td>
                                       <td th:text="${reservation.numberOfPeople + '名'}"></td>
                                       <td th:text="${#numbers.formatInteger(reservation.amount, 1, 'COMMA') + '円'}"></td>
                                   </tr>
                               </tbody>
                           </table>
		   </main>
	
			<div th:replace="~{fragment :: footer}"></div>
       </div>
        <div th:replace="~{fragment :: scripts}"></div>

        <!-- Swiper -->
        <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
        <script th:src="@{/js/carousel.js}"></script>
    </body>
    
</html>
